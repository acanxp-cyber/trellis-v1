name: iOS Signed Build

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "App Store version"
        required: true
        default: "1.0"
        type: string
      build_number:
        description: "Build number; leave empty to use run number"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ios-signed-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Import signing certificate
        shell: bash
        run: |
          set -euo pipefail

          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/distribution.p12"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" |
            base64 -D > "$certificate_path"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" |
            base64 -D > "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" >/dev/null

          identity="$(security find-identity -v -p codesigning "$keychain_path" |
            awk -F'"' '/Apple Distribution/{print $2; exit}')"
          test -n "$identity"

          serial="$(openssl pkcs12 \
            -in "$certificate_path" \
            -nokeys \
            -clcerts \
            -passin "pass:$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" 2>/dev/null |
            openssl x509 -noout -serial |
            sed 's/serial=//' |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]')"
          test -n "$serial"

          echo "APP_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_CERTIFICATE_SERIAL=$serial" >> "$GITHUB_ENV"

      - name: Ensure Bundle ID and profile
        shell: bash
        env:
          PROFILE_OUTPUT_PATH: ${{ runner.temp }}/SOMETHING.mobileprovision
          SIGNING_METADATA_PATH: ${{ runner.temp }}/signing.json
          BUNDLE_IDENTIFIER: com.acanxp.trellis
          BUNDLE_NAME: SOMETHING
        run: node scripts/asc-ensure-signing.mjs

      - name: Install provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          profile_path="$RUNNER_TEMP/SOMETHING.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

      - name: Resolve build
        shell: bash
        run: |
          build_number="${REQUESTED_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          profile_name="$(jq -r '.profileName' "$RUNNER_TEMP/signing.json")"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "Building ${MARKETING_VERSION} (${build_number}) with ${profile_name}"

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build"
          xcodebuild \
            -project Trellis.xcodeproj \
            -scheme Trellis \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/build/SOMETHING.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$APP_SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          export_path="$RUNNER_TEMP/export"
          mkdir -p "$export_path"

          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c "Clear dict" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :destination string export" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${APPLE_TEAM_ID}" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$export_options"
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:com.acanxp.trellis string ${PROFILE_NAME}" \
            "$export_options"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/build/SOMETHING.xcarchive" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload build to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$API_KEY_PATH" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          ipa_path="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          xcrun altool \
            --upload-app \
            --file "$ipa_path" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --output-format json

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: SOMETHING-signed-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

