name: App Store Preflight

on:
  workflow_dispatch:
    inputs:
      app_store_version:
        description: App Store version to inspect
        required: false
        default: "1.1"
      attach_build_version:
        description: Build number to attach (optional)
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      APP_STORE_VERSION: ${{ inputs.app_store_version || '1.1' }}
      ATTACH_BUILD_VERSION: ${{ inputs.attach_build_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Inspect App Store Connect
        run: node scripts/asc-preflight.mjs

