name: iOS Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "icons/**"
      - "vendor/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "ios/**"
      - ".github/workflows/ios-cloud-build.yml"

permissions:
  contents: read

concurrency:
  group: ios-cloud-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: npm ci
      - run: npm run cap:sync
      - name: Simulator build
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Unsigned device archive
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/build/Trellis.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          cd "$RUNNER_TEMP/build"
          ditto -c -k --sequesterRsrc --keepParent \
            Trellis.xcarchive Trellis-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Trellis-unsigned
          path: ${{ runner.temp }}/build/Trellis-unsigned.zip
          retention-days: 14
