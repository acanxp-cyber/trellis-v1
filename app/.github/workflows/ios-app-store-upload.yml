name: Upload to App Store Connect

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version, for example 1.0"
        required: true
        type: string
      build_number:
        description: "Unique build number"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-app-store-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      BUNDLE_ID: "com.example.trellis"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Validate secrets
        run: |
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_P8_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64
          do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
      - run: npm ci
      - run: npm run cap:sync
      - name: Install signing assets
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert_path="$RUNNER_TEMP/distribution.p12"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 -D > "$cert_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" >/dev/null

          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Apple Distribution/{print $2; exit}')"
          test -n "$identity"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          test "$profile_team" = "$APPLE_TEAM_ID"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          echo "APP_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
      - name: Signed archive
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/build/Trellis.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$APP_SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            -allowProvisioningUpdates \
            archive
      - name: Upload
        run: |
          set -euo pipefail
          api_key="$RUNNER_TEMP/AuthKey.p8"
          export_plist="$RUNNER_TEMP/ExportOptions.plist"
          export_path="$RUNNER_TEMP/export"
          mkdir -p "$export_path"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 -D > "$api_key"

          plutil -create xml1 "$export_plist"
          /usr/libexec/PlistBuddy -c "Clear dict" "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :destination string upload" "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${APPLE_TEAM_ID}" "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$export_plist"
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:${BUNDLE_ID} string ${IOS_PROFILE_NAME}" \
            "$export_plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build/Trellis.xcarchive" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_plist" \
            -authenticationKeyPath "$api_key" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -allowProvisioningUpdates
